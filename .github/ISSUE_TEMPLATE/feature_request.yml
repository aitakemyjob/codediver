name: Feature request
description: Suggest an idea or improvement for CodeDiver.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why it's hard today.
      placeholder: "When reviewing an agent's proposal I can't tell which tests cover the changed functions..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The ideal behaviour, a sketch of the UI, or an MCP tool you'd want agents to have.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Code exploration UI
        - Graphs and diagrams
        - Heatmaps
        - Git review
        - Agent / MCP tools
        - Language support
        - Install / packaging
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to help implement this.
