name: Label PRs

# Adds area labels to pull requests from the files they touch
# (rules in .github/labeler.yml). pull_request_target lets this work on
# fork PRs; it never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: false
