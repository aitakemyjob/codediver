name: Release

# Push a version tag to publish a release:
#
#   make release VERSION=v0.2.0        (or: git tag v0.2.0 && git push origin v0.2.0)
#
# Tags with a suffix (v1.0.0-beta.1) are published as pre-releases. Every
# platform is built by scripts/build.sh or scripts/build.ps1 — the same
# scripts developers run locally.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GO_VERSION: '1.26.x'
  NODE_VERSION: '24'
  NFPM_VERSION: 'v2.43.0'

jobs:
  verify:
    name: Verify tag & test
    runs-on: ubuntu-latest
    steps:
      - name: Tag is semver
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run typecheck && npm test
      - run: go vet -tags nogui ./... && go test -race -tags nogui -count=1 ./...

  desktop:
    name: Desktop · ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: ubuntu-24.04, platform: linux/amd64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { name: macos-universal, os: macos-latest, platform: darwin/universal }
          - { name: windows-amd64, os: windows-latest, arch: amd64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          # Optional macOS signing/notarization; leave secrets unset to skip.
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build.sh --platform ${{ matrix.platform }} --version "$TAG" --package

      - name: Windows prerequisites
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build.ps1 -Arch ${{ matrix.arch }} -Version $env:TAG -Package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  headless:
    name: Headless binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/build.sh --headless --version "$TAG" --package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-headless
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [desktop, headless]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # sign build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SBOM (SPDX) of Go and npm dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/codediver_${{ env.TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
      - name: Release notes header
        run: |
          cat > notes.md <<EOF
          ## Install

          **macOS / Linux:** \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh\`

          **Windows:** \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.ps1 | iex\`

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon + Intel) | \`codediver_darwin_universal.zip\` |
          | Windows | \`codediver_windows_amd64_installer.exe\` or \`codediver_windows_amd64.zip\` |
          | Linux x64 | \`.deb\`, \`.rpm\` or \`.tar.gz\` (\`codediver_linux_amd64.*\`) |
          | Linux ARM64 | \`codediver_linux_arm64.*\` |
          | Headless server (\`codediver serve\`) | \`codediver-headless_<os>_<arch>.*\` |

          Verify downloads against \`checksums.txt\`, and check that a file was built by this repository's release workflow with:

          \`\`\`sh
          gh attestation verify <file> --repo ${GITHUB_REPOSITORY}
          \`\`\`

          The SBOM (\`codediver_${TAG}.spdx.json\`) lists every Go and npm dependency in this release.
          EOF
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: CodeDiver ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
